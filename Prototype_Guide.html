ntext clears selections and cannot create access.", "columns": ["Context", "Baseline", "Boundary"], "rows": [["Company preparation", "REL-01", "Company-owned"], ["ENG-A", "REL-01", "PER-A"], ["ENG-B", "REL-01", "PER-A and PER-B; facts incomplete"]], "fields": [["Selected engagement", "ENG-A"], ["Purpose", "Access review"], ["Perimeter", "PER-A"]], "actions": [["context", "Apply permitted context"]], "links": ["SCR09", "SCR17"], "story": "Choose the organisation, scope and mission before reviewing information. The same document can have different relevance in different missions."}, {"id": "SCR03", "title": "Source registry", "workspace": "Curation", "lead": "Register source families even when text may only be referenced.", "columns": ["Source", "Version", "Admission", "Rights"], "rows": [["Framework A", "Edition 1", "Admitted synthetic source", "Display permitted"], ["Framework B / notice B-N1", "Revision 1", "Changed notice", "Distribution expired"]], "fields": [["Issuer", "Synthetic standards owner"], ["Family", "Framework B"], ["Mode", "ReferenceOnly"], ["Language", "en"]], "actions": [["source", "Stage source entry"]], "links": ["SCR04", "SCR22"], "story": "Register the two fictional frameworks. Record whether their content may be stored, processed and shown to users before importing it."}, {"id": "SCR04", "title": "Source detail", "workspace": "Curation", "lead": "A notice revision is distinct from the main edition and from extraction history.", "columns": ["Dependency", "Version", "Completeness"], "rows": [["B-N1 notice", "r1", "Complete synthetic example"], ["Definition set", "r1", "Included"], ["Native edition", "Edition 1", "Unchanged"]], "fields": [["Document role", "Notice"], ["Native locator", "B-N1"], ["Use requested", "Redistribute"], ["Rights basis", "Synthetic renewed permission"]], "actions": [["renew", "Record renewed distribution right"]], "links": ["SCR05", "SCR08"], "story": "A clarification may change evidence expectations without changing the main framework edition. Keep both versions traceable."}, {"id": "SCR05", "title": "Mapping workbench", "workspace": "Curation", "lead": "Compare dimensions and retain source-specific duties that the neutral objective does not cover.", "columns": ["Dimension", "Neutral objective", "Framework B"], "rows": [["Purpose", "Attributable access review", "Attributable access review"], ["Evidence", "Review record", "Review record and reviewer justification"], ["Residual", "None implied", "Reviewer justification remains"]], "fields": [["Source atom", "B-ACCESS-r1"], ["Target requirement", "REQ-ACCESS-r1"], ["Relationship", "Extends"], ["Rationale", "Additional reviewer justification is a residual"]], "actions": [["mapping", "Save mapping candidate"], ["orphan", "Demonstrate targetless Orphan"]], "links": ["SCR06", "SCR07"], "story": "Central objective: review access regularly. The payment framework asks for the review record; the resilience framework also asks why access was retained. Share the common objective, but keep that additional obligation visible."}, {"id": "SCR06", "title": "Conflict queue", "workspace": "Curation", "lead": "Cases preserve unresolved duties instead of hiding them in a coverage total.", "columns": ["Case", "Kind", "Owner", "Disposition"], "rows": [["CASE-01", "Residual", "Catalogue expert", "Justification not covered"], ["CASE-02", "Orphan", "Curator", "No target requirement"]], "fields": [["Case", "CASE-01"], ["Disposition", "Retain explicit residual"], ["Reason", "Neutral objective does not cover the added evidence depth"]], "actions": [["case", "Save proposed disposition"]], "links": ["SCR05", "SCR07"], "story": "A suggested match is incomplete if reviewer justification is absent. An unresolved difference remains visible for expert review."}, {"id": "SCR07", "title": "Expert review", "workspace": "Curation", "lead": "Authorisation binds exact meaning, dependencies, language and timing.", "columns": ["Subject", "Content", "Dependency", "Status"], "ro able. Maya reviews the local impact before adopting it. Alex separately assesses a mission amendment; the original report retains its original basis."}, {"id": "SCR25", "title": "My work", "workspace": "All", "lead": "Coordination tasks point to the authoritative domain decision.", "columns": ["Task", "Owner", "Meaning"], "rows": [["Respond to FIND-A-01", "Client respondent", "Factual response only"], ["Review PER-B", "Scope owner", "Complete declared facts"], ["Resolve source rights", "Rights steward", "Permitted-use decision"]], "fields": [["Task", "Respond to FIND-A-01"], ["Note", "Response supplied through finding workflow"]], "actions": [["task", "Resolve coordination task"]], "links": ["SCR26", "SCR20"], "story": "Maya, Clara and Alex receive different tasks. Each task links to the actual requirement, evidence decision or finding that needs attention."}, {"id": "SCR26", "title": "Activity and thread panel", "workspace": "All", "lead": "Messages retain exact subject and audience; a comment is never an approval.", "columns": ["Event", "Subject", "Audience"], "rows": [["Client disputed facts", "FIND-A-01 r1", "Selected shared participants"], ["Private follow-up note", "Workpaper r1", "Assessor only"]], "fields": [["Comment", "Please provide the missing record"], ["Audience", "Selected shared participants"]], "actions": [["comment", "Add attributed comment"]], "links": ["SCR20", "SCR25"], "story": "Keep discussions attached to the correct subject and audience. Writing “looks good” in a message does not grant approval."}, {"id": "SCR27", "title": "Search", "workspace": "All", "lead": "Exact and lexical retrieval remain usable with inference disabled.", "columns": ["Result", "Version", "Why shown"], "rows": [["REQ-ACCESS", "r1 / REL-01", "Neutral objective in permitted catalogue"], ["EV-01 V1", "Apr–Jun / PER-A", "Only under company or audit grant"]], "fields": [["Query", "Access review"], ["Corpus", "Current permitted context"]], "actions": [["search", "Search exact permitted records"]], "links": ["SCR10", "SCR28"], "story": "Find requirements and evidence through authorised search. Core search remains available when generative assistance is disabled."}, {"id": "SCR28", "title": "Assistant drawer", "workspace": "All", "lead": "Optional cited wording preserves the stored result and cannot approve anything.", "columns": ["Claim", "Citation", "Limitation"], "rows": [["PER-A is affected", "CHANGE-01 / TRACE-01", "Stored result"], ["PER-B is unknown", "CHANGE-01 / TRACE-02", "Missing population facts"]], "fields": [["Task", "Explain local impact"], ["Context", "CHANGE-01 exact revision"], ["Budget", "B1; bounded optional draft"]], "actions": [["ai", "Simulate bounded draft"], ["adoptdraft", "Keep wording as draft"]], "links": ["SCR24", "SCR29"], "story": "An optional assistant explains an approved requirement using permitted citations. It cannot change the stored requirement or approve a mapping."}, {"id": "SCR29", "title": "Operations console", "workspace": "Administration", "lead": "Operators inspect receipts and budgets without semantic authority.", "columns": ["Job", "State", "Limit"], "rows": [["Publication REL-02", "Guarded automatic execution", "No force publish"], ["Assistance draft", "Optional", "Parent B1 envelope"], ["Inventory run", "Partial", "Retry within scope"]], "fields": [["Job", "AI-JOB-01"], ["Reason", "Inspect remaining budget"]], "actions": [["job", "Inspect safe job receipt"], ["canceljob", "Cancel optional job"]], "links": ["SCR08", "SCR15", "SCR30"], "story": "An operator can inspect failed jobs and consumption limits. The operator cannot approve the meaning of catalogue content."}, {"id": "SCR30", "title": "Governance console", "workspace": "Administration", "lead": "Grants, source rights, expertise, retention and recovery have distinct responsible owners.", "columns": ["Policy", "Owner", "Status"], "rows": [["Competence and conflicts", "Catalogue governance", "Ratification required"], ["Retention and holds", "Privacy/data owner", "No legal duration assumed"], ["Deployment recovery", "Operations/security", "Qualification pending"]], "fields": [["Support scope", "Metadata only"], ["Reason", "Investigate failed run"], ["Duration", "Time-bounded by policy"]], "actions": [["support", "Preview bounded support access"]], "links": ["SCR01", "SCR04", "SCR32"], "story": "Different owners manage access, source permissions, expert qualifications and retention. Service administration does not grant professional authority."}, {"id": "SCR31", "title": "Plan and usage", "workspace": "Company", "lead": "Commercial eligibility never grants source rights or private workpaper access.", "columns": ["Meter", "Used", "Limit", "Interpretation"], "rows": [["Original storage", "420 GB", "500 GB proposed", "Internal replicas excluded"], ["Optional drafts", "80", "100 proposed", "Logical completions, not provider calls"], ["ENG-B sponsor", "Company", "One effective sponsor", "No duplicate activation charge"]], "fields": [["Sponsor", "Firm practice"], ["Mission", "ENG-B"], ["Effective date", "2027-01-01"], ["Overage cap", "Explicit acceptance required"]], "actions": [["sponsor", "Preview sponsorship transfer"], ["budget", "Preview capped allowance"]], "links": ["SCR30", "SCR32"], "story": "Show service usage and plan limits. Commercial eligibility does not confer rights to framework text or private auditor notes."}, {"id": "SCR32", "title": "Import export and exit", "workspace": "Company", "lead": "A generated archive is not a delivered export or proof that every byte was deleted.", "columns": ["Item", "Disposition", "Reason"], "rows": [["EV-01 V1", "Include if permitted", "Exact custody and digest"], ["REPORT-A-01", "Include if permitted", "Historical issued package"], ["Private assessor note", "Excluded", "No export grant"], ["External old version", "Unavailable if absent", "Never substitute latest"]], "fields": [["Export purpose", "Customer portability"], ["Recipient", "Named company owner"], ["Scope", "Permitted Northstar records"]], "actions": [["export", "Preview controlled export"], ["close", "Preview closure obligations"]], "links": ["SCR13", "SCR21"], "story": "Prepare an authorised export with exact versions and recipient checks. Archive generation alone is not delivery, and an exit request is not proof of completed deletion."}], "modules": [{"id": "M01", "interface": "IF01", "name": "Organisation and access", "value": "Give every person the correct company, perimeter and engagement context while preserving accountable authorship when teams change. The organisation hierarchy describes the customer; a separate grant controls permitted actions.", "actors": "Company administrators manage entities and teams. Delegated sponsors propose grants. Verified recipients accept bounded invitations. Security suspends access under its own authority.", "screens": ["SCR01", "SCR02"], "records": "E01 Tenant; E02 Company; E03 MembershipGrant", "steps": [["Register organisation", "Declare legal entities, accountable owner and deployment. Activate only after the required responsible roles are assigned."], ["Define access", "Select exact tenant, company, perimeter, engagement, purpose, actions and validity. Preview effective access before committing."], ["Invite and accept", "Present identity, role, scope and expiry. Reissue invalidates the former invitation token; matching names never merges identities."], ["Review or revoke", "Recheck all remaining grants and show what access persists. Expiry/revocation blocks subsequent disclosure and queued deliveries."], ["Transfer work", "Reassign responsibility explicitly without rewriting the original author or automatically transferring evidence visibility."]], "fields": [["Organisation", "Legal/display name, identifier scheme/value, jurisdiction and effective hierarchy; unknown legal facts remain unknown."], ["Hierarchy and team", "Effective-dated associations, accountable owner, producer and backup; reject cycles and cross-tenant parent changes."], ["Grant", "Issuer/subject identity, company/engagement/perimeter, selected object classes, purpose and explicit capabilities."], ["Validity", "Start and exclusive expiry with timezone, issuer, reason, policy and review due date; export is separate from read."], ["Invitation", "Verified destination, token status, acceptance/cancellation receipt and identity-link result."], ["Delegation", "Issuer must have delegation authority for each proposed scope/action; arbitrary group attributes cannot create expertise."]], "rules": [["BR01", "Current identity, a valid grant for this precise action/context, classification/source rights and no overriding restriction must all hold. Do not combine unrelated grants into an ungranted purpose."], ["Company CO-P01 — proposal", "Revoking one grant may leave another legitimate grant. The administration preview must show actual remaining access, not claim global removal."], ["Context boundary", "Changing tenant clears selection, cached previews and prior search results. Safe denied links, counts and recent items cannot expose hidden clients."], ["Professional boundary", "IdP membership, firm affiliation and administrator roles do not confer catalogue competence or client report authority."]], "edges": "Accepted wrong-identity invitations require suspension and investigation. A last-administrator departure uses controlled recovery or closure. Identity-provider failure does not permit an authentication bypass. Material already downloaded cannot be technically recalled.", "bulk": "Stage entity/member imports with identity matches, rejected rows and proposed grants. Apply authorised rows with individual receipts. Reassignment previews access changes; it cannot create evidence rights by spreadsheet flag.", "exchange": "IF01 supplies current actor/context decisions to all services. M16 propagates revocations and bounded support. M18 owns cross-tenant migration; changing a parent field cannot move protected data.", "example": "Alex can inspect/comment on Payment platform audit / Payment platform until 30 September 2026 at 18:00 UTC. Merchant services and export remain denied regardless of firm membership or mission sponsor."}, {"id": "M02", "interface": "IF02", "name": "Source inventory and permitted intake", "value": "Maintain the complete relevant payments source landscape and admit exact material through an appropriate channel. Catalogue breadth, availability, processing rights and semantic review are independent dimensions.", "actors": "Editorial owner registers sources; rights steward records allowed uses; intake operators manage acquisition; curators review source completeness.", "screens": ["SCR03", "SCR04"], "records": "E04 FrameworkVersion; E05 SourceRevision and fragments; E06 SourcePermission", "steps": [["Register", "Record family, issuer, edition, language and document role even where only a reference may be held."], ["Evaluate use", "Check acquisition, storage, parse/OCR, indexing/embedding, inference, display, translation, redistribution and retention separately."], ["Acquire safely", "Capture permitted upload, feed/portal response or attributed structured/manual entry with origin and receipt."], ["Inspect extraction", "Preserve parser version, native fragments, definitions, notices, exceptions and missing annexes. Processing success is not complete admission."], ["Maintain", "Append exact native or extraction revision. A notice may change independently of the main framework edition."]], "fields": [["Identity", "Issuer, family, title, edition/amendment, document role, parent dependencies and native locator; clause number alone is not identity."], ["Dates and variants", "Publication/effective/withdrawal dates with precision and basis; language and authoritative translation relationship."], ["Ownership", "Editorial, rights and monitoring owner required before admitted use; assignment does not prove qualification."], ["Receipt", "Channel, origin/object/version, actor/service, acquired time, digest where retained and parser revision."], ["Permission", "Per-operation Allowed/Denied/Unknown/Conditional, evidence, audience, territory, destination, purpose and effective interval."], ["Completeness", "Complete/Partial/Unknown, missing components and reason; inventory, scan and rights states remain separate."]], "rules": [["BR02", "Registration does not establish acquired rights. Unknown permission blocks the affected operation while preserving entitled metadata."], ["Context closure", "A duty requires its relevant definitions, conditions, role, exceptions, notices and tables. Model wording cannot replace missing native context."], ["Derivatives", "OCR, quotations, embeddings, translations and generated paraphrases retain applicable source restrictions. Reference-only mode cannot reconstruct protected text."], ["Identity and revisions", "Similar titles never merge sources. Equal bytes can share protected storage only under compatible policy while preserving acquisition receipts."]], "edges": "Unsupported format, missing annex, portal outage, expired rights and parser change have different recovery owners. Unknown edition or authority is displayed. Source expiry invalidates affected access and projections without pretending all lawful historical receipts are deleted.", "bulk": "Stage inventory imports with per-row identity, dependency and permitted-use outcomes. Admit source families abstractly without assuming every programme is a company checklist or requiring text access for design.", "exchange": "IF02 serves exact entitled source context to M03/M04/M12/M15. Permission is checked at processing, expert review, activation and each reader/export disclosure. Safe events contain identifiers rather than source text.", "example": "Resilience clarification revision 1 is a notice under Operational resilience framework (fictional). Its distribution permission expires before Catalogue release 2 activation. Reference metadata can remain visible while that execution is blocked."}, {"id": "M03", "interface": "IF03", "name": "Requirements mappings and guidance", "value": "Organise reusable audit objectives while retaining native duties and unresolved differences. Curated shared guidance helps preparation without pre-judging any actual evidence.", "actors": "Curators edit atoms, requirements and comparisons; specialists advise on cases; a qualified final expert authorises the exact package through M04.", "screens": ["SCR05", "SCR06"], "records": "E07 Atom; E08 Requirement and proposed CatalogueGuidance; E09 Link; E10 Case", "steps": [["Atomise", "Separate independently meaningful duties while retaining conditions, definitions and exact native anchors."], ["Compare dimensions", "Select a neutral objective and compare actor, object, population, trigger, cadence, depth, evidence, retention and exceptions."], ["Propose relationship", "Choose Equivalent/Subsumed/Extends/Partial/Conflicting/Orphan with rationale and explicit covered/uncovered facets."], ["Handle case", "Assign, investigate and propose justified resolution, retained limitation or visible release exclusion."], ["Prepare guidance", "Link evidence expectations, questions and procedures to exact contributions; include meaning-bearing guidance in review closure."]], "fields": [["Atom", "Exact fragment, actor/action/object, normative role, condition, frequency, population and editorial provenance."], ["Requirement", "Stable concept/revision, objective, domain, boundary, outcome, structured facets and change reason."], ["Link", "Source atom, actual target except Orphan, dimensions, type, rationale, residuals, cases and effective context."], ["Case", "Residual/conflict/orphan kind, exact bases, scope/time, severity, owner, consultations and disposition."], ["Guidance", "Proposed E08 subtype: evidence purpose/form/attributes, producer, period/scope, steps, questions, expected corroboration and limits."], ["Guidance basis", "Source-mandated, TAS-authored or adapted; exact rights/source basis and language/review revision."]], "rules": [["BR03", "Subsumed means the source duty is contained in the neutral requirement; do not attribute surplus to the source. Extends preserves additional source duty. Partial links do not automatically combine into Equivalent."], ["Orphan and coverage", "Orphan has no fabricated target. Conflicting identifies a real target and incompatible duties. Count atoms once, not links, in source coverage denominators."], ["CAT-P01 — proposal", "Reviewed unresolved cases can appear only as explicit limitations under a ratified inclusion policy. Rights, provenance or false-coverage defects block publication."], ["INT-P01 / INT-P02 — proposals", "Shared guidance belongs to E08/M03; tenant requests remain E18/M06. E10 supports an optional orphan case while E09 remains targetless."]], "edges": "Missing context returns to intake; absent expertise holds review. Stale saves preserve both drafts for comparison. A stricter-looking retention or frequency value is not automatically a safe common requirement; incompatible dimensions need a case.", "bulk": "Import candidates with per-link validation and source provenance. Bulk edits append revisions and impact work; no model-confidence threshold authorises a release. Preserve splits/merges/replacements and reject replacement-lineage cycles.", "exchange": "IF03 owns semantic drafts. M04 freezes exact members and dependencies. M06 instantiates reviewed guidance locally; M10 owns evidence relevance. No customer private notes enter shared catalogue guidance.", "example": "A-ACCESS maps to an attributable review objective. Operational resilience framework (fictional) adds reviewer justification: preserve an Extends residual. A genuinely uncovered duty remains a targetless Orphan."}, {"id": "M04", "interface": "IF04", "name": "Expert review and automatic publication", "value": "Bind catalogue meaning to an identifiable qualified human, then execute that exact decision automatically when current guards pass. Content, review, authority and execution states are independently visible.", "actors": "Final TAS expert reviews meaning; governance administers competence/conflicts; rights steward resolves use conditions; operator reconciles execution without approval authority.", "screens": ["SCR07", "SCR08"], "records": "E11 ReviewSubject; E12 ApprovalAuthorisation; E13 ReleaseManifest", "steps": [["Freeze", "Close exact atoms, requirements, links, cases, guidance, languages, dependencies, exclusions and expected predecessor."], ["Review", "Comment, consult, return or reject with reasons. A comment such as approved has no authorisation effect."], ["Authorise", "Human confirms exact subject/digest, release scope, timing and validity under current competence and conflict policy."], ["Execute", "At immediate/scheduled time recheck authority, rights, digest, predecessor and policy; commit manifest/head/outbox atomically."], ["Maintain", "Retry eligible unchanged work idempotently; suspend or replace with attribution. Meaning changes create a new subject and fresh review."]], "fields": [["Subject", "Exact members/dependencies, canonical digest, intended manifest, exclusions, language and validation receipts."], ["Expert grant", "Named human, competence families/languages, validity, conflict restrictions and protected qualification evidence."], ["Review", "Assigned expert, consulted advice, questions, declared limitations and Return/Reject/Authorise reason."], ["Authorisation", "Subject/digest, human/grant, earliest activation, expiry, predecessor and policy confirmation."], ["Execution", "Operation/attempt, scheduled/blocked/failed/active state, safe guard failures and retry eligibility."], ["Release", "Immutable manifest, activation time, predecessor and suspension/replacement lineage."]], "rules": [["BR04", "Meaning, language, guidance or dependency changes invalidate the old exact subject. A confirmation checkbox cannot persist across a changed digest."], ["BR05", "Valid explicit expert authority leads to automatic guarded software execution. No second routine human release requester; AI cannot approve or force publication."], ["Governance remains open", "Do not inherit a fixed numerical quorum. Competence, independence, self-review, conflicts, consultation and expiry need ratified operational rules."], ["Authority boundary", "Catalogue approval does not decide company scope, evidence relevance, findings or client report issue. Operators cannot invent approval to unblock jobs."]], "edges": "Expired rights can coexist with visible approval and blocked execution. Renewal does not cure expired expert validity or stale predecessor. Competing activations use expected-head comparison. Revocation after release requires attributable suspension/review rather than rewriting history.", "bulk": "Split review subjects only when independently meaningful and closed. Each package keeps its exact authority, timing and current guards; bulk processing cannot grant unrelated subject approval.", "exchange": "IF04 owns protected human authority and activation. IF16 exposes safe operational status. Release events create M13 impact candidates; they do not adopt local baselines or amend engagements.", "example": "Catalogue release 2 is authorised but blocked by expired distribution rights. If renewed while all other guards remain valid, automatic execution activates once. Payment platform audit continues to reference Catalogue release 1."}, {"id": "M05", "interface": "IF05", "name": "Company scope and applicability", "value": "Explain applicability and instrument eligibility from declared facts and exact rules. Keep deterministic evaluation separate from the human scope opinion and the selected preparation baseline.", "actors": "Company declarer owns facts and population completeness; scope specialist reviews interpretation; company authority adopts preparation; mission authority separately fixes engagement context.", "screens": ["SCR09"], "records": "E14 ProfileSnapshot; E15 Perimeter; E16 ScopeMemo and RuleSet; E17 TenantBaseline", "steps": [["Declare facts", "Capture business/data roles, jurisdictions, systems and attributed population basis with effective and recorded times."], ["Define perimeter", "Include/exclude assets and shared services with rationale; overlapping perimeters remain explicit."], ["Evaluate", "Use exact rules/facts/source versions and preserve logical True/False/Unknown plus operational Error/NotEvaluated."], ["Review opinion", "Human records reason, limitations and any disagreement without editing the stored engine trace."], ["Adopt", "Select exact release, profile, perimeter, rule set and memo against the expected former preparation baseline."]], "fields": [["Fact", "Name/type/unit, value or Unknown/NotDeclared, declarer, source and effective/recorded interval."], ["Population", "Named universe, enumeration method, expected/discovered counts, missing partitions, completeness and attestor."], ["Perimeter", "Included/excluded members, purpose, dependency/shared service, owner, period and reason."], ["Rule", "Admitted executable revision, parameters, formal question and explicitly defined empty-population treatment."], ["Trace", "Exact inputs, per-rule results, missing dependencies, operational errors, configuration and evaluation time."], ["Memo/baseline", "Engine outcome, separate human disposition, limitations, exact references, adopter and predecessor."]], "rules": [["BR06", "Unknown is not False. Collected observations do not declare facts or prove a complete estate. Unsupported formal instrument rules remain NotEvaluated."], ["Company CO-P02 — proposal", "AND is False if any term is False, True only when all are True; OR is True if any is True, False only when all are False; otherwise Unknown. NOT preserves Unknown."], ["Population semantics", "Universal True requires supported completeness and all members satisfying the predicate; a known counterexample refutes it. Existential False requires complete enumeration and no satisfying member."], ["Separate results", "Preserve errors/skipped terms even if another operand decides the logical result. Human disagreement retains engine and human outcomes with reason."]], "edges": "Missing rules, conflicting facts, incomplete population and unavailable dependencies have explicit remedies. A declared complete empty universe requires a substantiated basis and rule-defined treatment. Deferred adoption cannot postpone a source obligation.", "bulk": "Stage inventory rows with matches, rejected/changed records and provenance. Declarer confirms accepted set and completeness limitations. Evaluate per perimeter; an aggregate cannot count Unknown as unaffected or outside scope.", "exchange": "IF05 consumes source/release and proposed observations. It supplies baseline to M06 and exact local facts to M13. IF09 fixes an independent mission snapshot rather than following latest preparation.", "example": "Payment platform facts support the stated processing context; Merchant services enumeration is incomplete and stays Unknown. Preparation adoption of Catalogue release 2 does not change Payment platform audit."}, {"id": "M06", "interface": "IF06", "name": "Preparation requirements and requests", "value": "Turn a selected requirement and its native contributions into accountable requests. Preparation readiness means material is ready for review, not that the company is compliant.", "actors": "Lead assigns owners and dates; producers supply exact evidence or an unavailability explanation; requester reviews preparation; assessor retains independent relevance and conclusions.", "screens": ["SCR10", "SCR11"], "records": "E18 RequirementAssignment and local guidance instance; E19 PreparationTask and request", "steps": [["Instantiate", "Select exact baseline, requirement and available reviewed guidance. Label local additions explicitly."], ["Assign", "Name owner/producer/backup, perimeter, period, form and due date; preserve source-specific residuals."], ["Respond", "Link exact evidence version and declared limitations or reason unavailable."], ["Review request", "Clarify, record documentary disposition or close preparation; this does not close independent audit requests."], ["Maintain work", "Reassign/revise prospectively; changed source, scope or evidence creates review work rather than silent completion."]], "fields": [["Assignment", "Baseline, requirement/contributions, accountable owner/team/backup and preparation state."], ["Guidance instance", "Exact catalogue guidance where available; local purpose, expected attributes/form and limitations."], ["Request", "Requester/recipient, period/scope, due time/timezone, permitted custody and classification."], ["Response", "Exact evidence, submitting actor, coverage claim, limitations and attributed message."], ["Review", "Preparation disposition, rationale, missing material, responsible actor and closure revision."], ["Calendar", "Native cadence/effective date, internal target, request deadline and reminder policy separately recorded."]], "rules": [["BR07", "Internal planned dates cannot change source duties. Source cadence, freshness, retention, request state and readiness remain distinct."], ["Lifecycle", "Preparation: Unassigned/Assigned/In progress/Ready for assessor review. Request: Draft/Open/Response submitted/Preparation reviewed/Closed or Cancelled; overdue/partial are flags."], ["Guidance boundary", "Local edits cannot change published catalogue guidance. Missing reviewed guidance is visible; assistance cannot invent an authoritative procedure."], ["Honest dashboard", "Counts show scope, denominator, filters and as-of time. A task-completion ratio is never labelled compliance coverage."]], "edges": "Missing owner, denied source, stale revision or partial response names the blocker. Clarification returns to open work with attributed question/new revision. Future-dated or unknown-period evidence cannot satisfy a dated request by default.", "bulk": "Preview each bulk assignment/request and permission. Combine requests only when purpose, scope, period, audience and definition match, preserving all origins. Owner transfer does not automatically transfer evidence visibility.", "exchange": "IF06 owns preparation decisions and M07 references; M14 coordinates safe reminders. Audit-origin requests retain their audit owner despite being answered in the Company workspace.", "example": "The access-review request receives Quarterly access review V1 for April–June Payment platform. Preparation can be ready while Payment audit evidence use retains an exception and Resilience review evidence use still lacks Merchant services coverage."}, {"id": "M07", "interface": "IF07", "name": "Evidence custody versions and reuse", "value": "Retain exact evidence with safe storage, provenance and controlled availability. Make reuse discoverable without inheriting another assessor’s decision.", "actors": "Producer submits material; custody owner classifies it; isolated workers scan; assessor examines safe exact material and records use in M10.", "screens": ["SCR12", "SCR13"], "records": "E20 EvidenceItem; E21 EvidenceVersion CustodyReceipt and renditions", "steps": [["Describe", "Choose item lineage and record producer, category, purpose, period/scope, classification and custody mode."], ["Receive safely", "Bounded upload ticket sends bytes only to quarantine; verify actual size/type/digest and isolated scan."], ["Promote", "Admit safe version with durable receipt and native/derivative lineage; uncertain storage remains unavailable."], ["Inspect/reuse", "Show exact permitted version and scope/period limits; each new use requires separate assessor relevance."], ["Correct/dispose", "New bytes create a new version; material metadata corrections flag affected uses; disposal follows explicit policy."]], "fields": [["Identity", "Item/version/predecessor, safe title and category; digest equality is not authorship or truth."], ["Provenance", "Producer or explicit unknown, source, produced/captured/received time, actor, scan and transformations."], ["Coverage", "Perimeters/population, period or explicit unknown, event marker, exclusions and claimed purpose."], ["Material", "Native name/type/bytes/digest, preview/OCR lineage and isolated processing receipt."], ["External mode", "Repository/object/exact version and allowed locator; distinguish link-only, snapshot and metadata-only."], ["Governance", "Owner, classification, purpose/audience, rights, retention/hold references and availability."]], "rules": [["BR08", "Custody is not sufficiency. Policy text, operational record, interview artefact and collected observation support different evidential purposes."], ["BR09", "Unavailable exact external material must not redirect to latest. Snapshot storage needs separate permission and retention basis."], ["Company CO-P03 — proposal", "Append byte and material metadata history. Redacted renditions keep exact lineage and separate audiences; omitted substance may require relevance review."], ["Tenant isolation", "No visible cross-tenant duplicate, count or existence signal. Proposed default is no cross-tenant deduplication; retention and audiences remain independent."]], "edges": "Quarantine, scanning, available, rejected, restricted, external version unavailable and disposed are distinct. Unknown period is allowed at intake but cannot silently pass a dated use. Repository outage is an availability failure.", "bulk": "Each file receives a durable result; retry failures without repeating successful admissions. Same visible bytes can preserve separate submission/purpose receipts. Concurrent versions need owner selection rather than last-arrival authority.", "exchange": "IF07 owns safe bytes/metadata and gateway tickets with current checks at redemption and bounded ranges. M10 owns E22 relevance; M18 owns controlled export/disposal. Shared catalogue AI never receives a customer evidence pool.", "example": "Quarterly access review V1 is a single April–June Payment platform payload with independent Payment audit evidence use/Resilience review evidence use. New V2 cannot rewrite REPORT-A-01. Lawful disposal makes old bytes explicitly unavailable."}, {"id": "M08", "interface": "IF08", "name": "Connections and bounded collection", "value": "Exchange scoped observations with qualified source systems while preserving exact capture, completeness and failure states. Collection does not administer infrastructure or assess compliance.", "actors": "Connection owner selects source/purpose; security admits endpoint/privilege; operators recover runs; declarers/custody services admit staged results.", "screens": ["SCR14", "SCR15"], "records": "E23 ConnectionGrant; E24 CollectionRun", "steps": [["Configure", "Bind tenant, source instance, family/adapter, owner, scope, endpoint and vault reference."], ["Validate", "Preview allowed partitions and missing privileges without widening consent; read-only collection is the reference."], ["Run", "Pin configuration/query/period/cursor and budget; stage paginated work durably."], ["Promote", "Pass observations to declaration or evidence custody. Advance checkpoints only after durable stage admission."], ["Recover", "Reconcile uncertain effects, bound cursor-reset rescans and stop future use after revocation."]], "fields": [["Grant", "Instance/account, purpose, operations, query scope, placement, validity and rights basis."], ["Secrets", "Vault reference only; no credential in browser, URL, logs, export or model context."], ["Run", "Adapter/parser/schema, filters, partitions, requested period and operation/correlation IDs."], ["Progress", "Opaque cursor/watermark, stable tie-break, checkpoint and per-partition result."], ["Completeness", "Requested/observed/accepted/rejected/missing counts, pagination/ACL limits and capture/effective times."], ["Recovery", "Safe error, attempt/retry, last complete success and accountable recovery owner."]], "rules": [["BR10", "Collector scope does not authorise tickets, notifications, directory writes or remediation. Every actual write is a separate admitted capability."], ["Identity", "Deduplicate by tenant, connection, instance, object/version and operation; not by similar title or cross-customer digest."], ["Callbacks", "Authenticate hints and reconcile authoritative source state. Durable acknowledgement, duplicate handling, gaps and delayed order are explicit."], ["Completeness", "Partial capture is not a complete estate. An empty or ACL-filtered response cannot establish absence or deletion."]], "edges": "Expired token, denied partition, rate limit, schema drift and invalid cursor have separate recoveries. Quarantine unsafe files and restrict endpoint/redirect/network destinations. Uncertain writes are reconciled before repeat.", "bulk": "INT01 identity, INT02 repositories, INT03 GRC, INT04 tickets, INT05 notifications, INT06 issuer channels, INT07 cloud configuration, INT08 infrastructure inventory, INT09 security evidence, INT10 interchange. These families do not imply installed vendor adapters.", "exchange": "IF08 sends proposed facts to M05 and exact custody to M07. Imported GRC ratings remain external assertions. Ticket Done cannot close a finding. Service ownership and external authority remain distinct.", "example": "Inventory captures 49 of 50 requested systems and labels the run Partial. Even 50 responses would still need a substantiated complete population declaration."}, {"id": "M09", "interface": "IF09", "name": "Engagement planning and portfolio", "value": "Plan a full professional mission against a fixed mandate and context. A firm portfolio is an index of authorised assignments, never a cross-client evidence pool.", "actors": "Coordinator handles allowed scheduling metadata; lead scopes the mission/programme; professional authority approves material amendments under local policy.", "screens": ["SCR16", "SCR17"], "records": "E25 EngagementSnapshot; E26 WorkProgramme and procedures", "steps": [["Intake", "Resolve client/sponsor/service, rights and independence. Accept for scoping, request clarification or decline."], ["Fix mandate", "Select exact entities/perimeters, period, purpose, editions, release, rules, facts, scope memo and exclusions."], ["Plan procedures", "Preserve native criteria, residuals, guidance basis, questions, populations, methods and competent assignments."], ["Perform", "Pin authorised mission/programme; fieldwork retains exact context and planned-versus-actual dates."], ["Amend/close", "Review material changes and affected completed work; closure preserves exceptions and successor missions remain separate."]], "fields": [["Intake", "Client, request origin, sponsor, lead, service/mandate, handling agreements and conflicts."], ["Snapshot", "Exact framework/source/release/rule/profile/scope references, period and selected boundaries."], ["Participants", "Identity, competence, role, procedures, object/action grants and validity."], ["Programme", "Objective, criterion, method, local questions, residual disposition, dependency and intended output."], ["Amendment", "Old/new diff, reason, evidence/sample/conclusion impact, effective time and approver."], ["Portfolio", "Permitted client label, own assignment, stage, dates and next action; row/count filters match."]], "rules": [["BR11", "New catalogue publication or company baseline adoption cannot change an active mission. Engagement snapshots are independent professional records."], ["Native methods", "Mixed-edition work labels each procedure basis. Removed duties remain explicitly excluded/unaddressed rather than silently deleted."], ["Competence/privacy", "Firm roles do not grant customer records. Team replacement preserves authorship; private-work transfer needs admitted policy."], ["Change assessment", "Completed work becomes a review candidate; assessor decides adequate, supplemental or unsupported, not automatic reset or continued approval."]], "edges": "Missing facts, instrument rules, rights, competent reviewer or permitted client context blocks the affected action. Draft planning may show gaps without inventing certification eligibility. Deferral cannot change source effective dates.", "bulk": "Bulk scheduling/assignment previews each grant and competence. Retain per-row receipts and retries. No bulk assessed shortcut without each procedure’s own responsible reasoning.", "exchange": "IF09 supplies exact mandate/programme to M10/M11, receives M13 amendment candidates and retains identity across M17 sponsor changes. M14 coordinates without owning professional mandate.", "example": "Payment platform audit uses Payment security framework (fictional) / Payment platform under Catalogue release 1. Resilience review selects Operational resilience framework (fictional) across both perimeters with explicit Merchant services uncertainty; proposed Catalogue release 2 amendment does not alter Payment platform audit."}, {"id": "M10", "interface": "IF10", "name": "Fieldwork interviews and evidence relevance", "value": "Record what was examined, what people said and what that work supports. Relevance, corroboration, assessment and professional review are separate attributable judgements.", "actors": "Assigned assessors perform work; respondents confirm/dispute exact statements; competent reviewers examine submitted workpapers under current access and independence policy.", "screens": ["SCR18", "SCR19"], "records": "E22 EvidenceUse; E27 Workpaper interview and statements; E28 SampleRecord", "steps": [["Prepare", "Pin criterion, period/perimeter, population, method, evidence expectation and question revisions."], ["Examine", "Inspect exact safe version/rendition and actual parts; record method/time and limitations."], ["Decide relevance", "For this mission/purpose/period/scope accept, limit, reject or request more information with rationale."], ["Assess", "Separate quote/paraphrase, corroboration, contradiction, private note and reviewable professional conclusion."], ["Review", "Submit exact revision; reviewer accepts, returns or escalates. Material edits require renewed review."]], "fields": [["Use", "Exact evidence, mission/procedure, period/purpose/perimeters, assessor, rationale and limitations."], ["Population", "Declared universe, expected/discovered counts, completeness and exact snapshot."], ["Sample", "Method/basis, strata/IDs, input ordering/filter/algorithm/seed when used, actual inspected count and substitutions."], ["Statement", "Speaker or explicit unknown, question, quote/paraphrase, time/scope and supporting references."], ["Confirmation", "Pending, Confirmed as recorded, Correction proposed, Disputed or Not requested with basis; silence is no response."], ["Assessment", "Actual steps, observations/contradictions, scheme/version, outcome, reason, limits and review record."]], "rules": [["BR12", "Reuse needs a new relevance decision; accepted material does not automatically prove control effectiveness or population completeness."], ["AU-P02 — proposal", "Working outcomes are No exception identified within performed work, Exception identified, Insufficient basis, Not performed, or Not applicable with authorised rationale. Native schemes require practitioner validation."], ["AU-P04 — proposal", "Private notes are not automatically lead/client visible. Necessary professional reasoning belongs in reviewable workpapers; sharing creates an attributed fact with deliberate audience."], ["Method integrity", "No invented sample size/statistical assurance or speaker identity. Statement confirmation concerns recorded testimony, not compliance. Recording/transcription needs explicit permission."]], "edges": "Missing corroboration, exact-version loss, period mismatch or unknown population stays visible. Save uses expected revision, preserving draft on conflict. Replacement sample items retain reasons and the originally unavailable item.", "bulk": "Bulk linking creates proposed uses and per-row warnings, not inherited acceptance. Sampling records planned versus examined members; never extrapolate a convenience sample to an unsupported population-wide assurance percentage.", "exchange": "IF10 consumes M07 custody and M09 context; sends exact findings basis to M11. M14 handles restricted exchanges. M15 may draft factual wording but cannot choose relevance or assessment outcome.", "example": "Payment audit evidence use supports access review with an exception; Resilience review evidence use supports only Payment platform record existence. Merchant services and reviewer justification remain missing even if interview minutes are confirmed."}, {"id": "M11", "interface": "IF11", "name": "Findings reports and audit follow up", "value": "Convert reviewed work into attributable findings and exact client deliverables. Keep client disagreement visible and control issue, disclosure and every later correction.", "actors": "Assessor drafts; client responds to selected facts; professional reviewer/issuer authorises exact package under engagement policy; operator executes eligible delivery.", "screens": ["SCR20", "SCR21"], "records": "E29 Finding and response; E30 ReportPackage and issue/delivery; E31 AuditActionReference", "steps": [["Draft finding", "Record criterion, condition, exact basis, scope/period, limitations and severity scheme."], ["Consult facts", "Share exact allowed version; record agreement, dispute, clarification or no response."], ["Dispose professionally", "Confirm, revise, withdraw or seek more evidence while retaining material responses."], ["Assemble/authorise", "Select exact sections/attachments, exclusions/redactions, template, language and frozen recipients; review rendered digests."], ["Issue/maintain", "Commit once and deliver per recipient. Corrections/addenda/translations/withdrawals/replacements need attributable fresh authority."]], "fields": [["Finding", "Native criterion, workpaper/use/sample basis, observed condition, attributed/hypothesised cause and scope."], ["Severity", "Scheme/version, category and reason; Unrated with basis remains possible."], ["Response", "Finding revision, respondent, position, text/references, due time and received time."], ["Package", "Purpose/type, template/version/rights, selected content, excluded private material and renderer/digests."], ["Authority", "Issuer competence/policy, exact manifest/content, resolved audience, language, validity and confirmation."], ["Delivery/action", "Per-recipient Pending/Delivered/Failed/Blocked/Uncertain; acknowledgement and professional action closure separately recorded."]], "rules": [["BR13", "Client response does not approve a report; catalogue authority does not approve customer conclusions; external Done does not close a finding."], ["AU-P03 — proposal", "Exact-package professional authorisation precedes guarded issue/delivery. Changed recipient, attachment, meaning or language requires fresh authority; no fixed review count is invented."], ["Readiness", "An adverse or limited conclusion may be correct. Require honest disposition of gaps and completed required reviews, not false closure of all findings."], ["History", "Issued bytes are immutable. Correction/addendum/replacement identifies predecessor and effect; prior downloaded copies cannot be forcibly recalled."]], "edges": "Stale issuer, unlicensed template, denied recipient, private attachment or unreviewed material blocks the affected stage. Delivery failure does not erase issue. An uncertain timeout requires receipt reconciliation.", "bulk": "Preview each package/recipient and exclusion with independent results. Consolidated findings retain distinct criteria/differences. Never hide disputes to improve a status dashboard.", "exchange": "IF11 uses M09/M10 exact basis and M07/M02 disclosure. M18 exports only entitled packages. Audit follow-up references remain bounded; enterprise remediation is a separate business extension.", "example": "REPORT-A-01 remains Catalogue release 1 / Quarterly access review V1. FIND-A-01 carries the unresolved dispute and assessor position. Later source change opens review work rather than editing issued content."}, {"id": "M12", "interface": "IF12", "name": "Source monitoring and editorial change", "value": "Maintain an accountable watch over admitted issuer channels. Detection produces source-change candidates; it does not establish new catalogue meaning or a complete global standards inventory.", "actors": "Monitoring owner maintains channel/cadence; operator recovers checks; curator triages exact changes; final expert remains catalogue authority.", "screens": ["SCR22"], "records": "E32 MonitoringPlan; E33 ChangeCandidate and check receipt", "steps": [["Plan", "Select source/channel, permitted method, expected coverage, cadence and owner."], ["Check", "Record exact cursor/version, captured time, completeness and operational outcome."], ["Detect", "Compare source fragments, roles, dates and dependencies; notices can change without a new main edition."], ["Triage", "Curator records urgency, reason, missing context and proposed editorial work."], ["Hand over", "M02 admits, M03 curates and M04 reviews/publishes. Only actual release creates a published notice basis."]], "fields": [["Plan", "Source/channel, scope, cadence, access basis, escalation and owner."], ["Check", "Run ID, source/cursor, time, completeness and Changed/NoChange/Partial/Failed outcome."], ["Difference", "Before/after exact revision, additions/deletions, roles and effective-date precision."], ["Triage", "Curator, urgency, dependencies, interpretation candidate and gaps."], ["Health", "Last complete success, missed checks, safe failure, retry and owner."], ["Handover", "Exact admitted revision and curation work; no automatic approval flag."]], "rules": [["BR14", "Failed or partial checks cannot be displayed as No change. State actual covered channels and gaps."], ["Revision clarity", "Source notice, annex, translation and extraction correction have separate identities. Edition equality does not mean content unchanged."], ["Authority", "Detection and even successful extraction do not approve interpretation. Missing context requires human/source resolution."], ["Optional assistance", "A3 can help triage permitted differences; deterministic comparison and manual curation support AI-off operation."]], "edges": "Portal outage, expired rights, missing annex and format drift have owned recovery. Urgent uncertainty may generate qualified advisory work, not a fabricated definitive instruction or universal detection promise.", "bulk": "Partition by channel and budget; preserve every result. Retry cannot duplicate candidates or broaden crawl scope. Cadence change requires plan revision and budget review.", "exchange": "IF12 feeds exact changes into IF02/IF03; IF04 activation is the trigger for local impact. Shared source monitoring cannot read customer private evidence.", "example": "Resilience clarification r1 changes evidence form; the monitor records the notice. Catalogue release 1 remains published until qualified exact authorisation and guarded Catalogue release 2 activation succeed."}, {"id": "M13", "interface": "IF13", "name": "Local impact and deliberate adoption", "value": "Explain how an exact source/release change touches declared customer facts and existing work. Preserve uncertainty and independent preparation/mission decisions.", "actors": "Local specialist/assessor reviews interpretation; company authority adopts preparation; engagement authority amends mandate; recipients acknowledge delivery without granting authority.", "screens": ["SCR23", "SCR24"], "records": "E34 ImpactRecord; E35 ChangePack adoption and local issue", "steps": [["Freeze inputs", "Select old/new releases, rules, facts, perimeters and current baseline."], ["Calculate", "Traverse changed source to atoms/links/cases/guidance/rules, evaluate local facts and identify dependent work."], ["Review pack", "Human assesses traces, unknowns, wording, proposed actions and exact audience."], ["Issue/notify", "Record local issue and separate recipient delivery/acknowledgement."], ["Choose adoption", "Adopt/defer preparation against expected baseline, or separately amend engagement; historical outputs stay pinned."]], "fields": [["Inputs", "Exact manifests/diffs, rule/profile/perimeter and algorithm/configuration."], ["Result", "Affected/Unaffected/Unknown/Error/NotEvaluated by boundary/dimension, trace and missing edges."], ["Dependencies", "Exact requests, uses, active missions and issued outputs identified for review, not mutation."], ["Pack", "Local reason, source date, internal target, limitation, owner, proposed work and recipients."], ["Authority", "Reviewed content/fact/audience revisions, local role/policy and validity."], ["Adoption", "Former/new baseline, schedule/defer reason, owner/review date and independent amendment reference."]], "rules": [["BR15", "Unaffected requires adequate facts and graph closure. Missing facts or dependency edges yield Unknown for the affected question."], ["Aggregation", "Payment platform Affected plus Merchant services Unknown remains incomplete overall; wording cannot change stored calculation."], ["Separate authority", "Acknowledgement, ticket creation or global expert approval does not adopt local context. New facts/wording/audience require updated local review."], ["Dates/history", "Deferral does not delay an external duty. Suspension pauses new adoption and opens review, not automatic historical rollback."]], "edges": "Concurrent adoption compares actual baseline head. Changed facts create new impact revision. Failed notification cannot erase an issued pack or an outstanding adoption decision.", "bulk": "Partition by tenant/baseline, retaining completed/unknown/failed/not-evaluated results. Each adoption needs exact local authority; no blanket approval across customers.", "exchange": "IF13 consumes M04/M05, opens M06 work and M09 amendment candidates. M11 controls report correction; M14 delivers safe notices; M15 only assists wording.", "example": "CHANGE-01 retains Payment platform Affected and Merchant services Unknown. Company preparation can adopt Catalogue release 2 while Resilience review awaits its own amendment and REPORT-A-01 stays historical."}, {"id": "M14", "interface": "IF14", "name": "Tasks exchanges and notifications", "value": "Coordinate accountable work while keeping messages separate from business authority. Each thread belongs to an exact domain record and explicit audience.", "actors": "Owners manage tasks; entitled participants comment/respond; domain owners decide meaning; notification service handles delivery only.", "screens": ["SCR25", "SCR26"], "records": "E36 CoordinationRecord task comment and notification receipt", "steps": [["Create", "Select exact subject, purpose, owner, due date and audience."], ["Discuss", "Attribute comments/questions and preserve private versus shared channels."], ["Respond", "Link exact material or explicit unavailability; owner evaluates the business consequence."], ["Notify", "Send safe minimal text after current recipient checks; opening rechecks access."], ["Resolve", "Close coordination with reason; underlying approval/finding/scope changes only through its owner."]], "fields": [["Subject", "Exact domain object/revision, tenant, purpose and classification."], ["Task", "Creator/owner/backup, title, due time/timezone, priority and state."], ["Comment", "Actor, time, wording, references and audience."], ["Correction", "Original attribution, new revision and reason."], ["Notification", "Resolved recipients, channel, template, schedule and current policy."], ["Receipt", "Operation/attempt, delivered/suppressed/failed/uncertain and separate acknowledgement."]], "rules": [["BR16", "Comment text saying approved is not authority. Task closure does not publish content or close a finding."], ["Audience", "Sharing a parent object does not share all child comments or private notes. Attached content retains actual rights."], ["Delivery", "Recheck grants at send/open; read receipt is not agreement. No response by deadline stays No response."], ["Safe work list", "My work, counts and recent items filter current grants without cross-client leakage."]], "edges": "Revoked recipient, stale subject, absent owner and unavailable attachment show safe actionable outcomes. Restricted source text and private findings must not appear in email previews.", "bulk": "Deduplicate reminders per task/recipient/window, retaining partial delivery. Reassignment does not create access to evidence. Bulk closure cannot substitute for domain decisions.", "exchange": "IF14 references owner services; explicit actions may invoke their permissioned commands. TaskClosed itself has no professional effect.", "example": "The client has a factual-response task for FIND-A-01. Resolving its conversation thread does not resolve the finding; M11 stores the professional disposition."}, {"id": "M15", "interface": "IF15", "name": "Search and optional knowledge assistance", "value": "Retrieve entitled exact knowledge and optionally prepare cited wording. Essential journeys work through stored content, structured forms and deterministic services without models.", "actors": "Permitted users search context; curators/assessors request allowed bounded uses; human adopts selected text into an owning draft, with separate professional approval later.", "screens": ["SCR27", "SCR28"], "records": "E37 RetrievalReceipt CandidateDraft and adoption lineage", "steps": [["Select context", "Choose catalogue or tenant/engagement corpus, exact versions, purpose and language."], ["Retrieve", "Exact lookup/lexical first; optional vectors/ranking only on admitted route. Filter before selection and at disclosure."], ["Close context", "Include required definitions/exceptions/notices; narrow or refuse when necessary basis is missing."], ["Generate", "Reserve parent budget and produce typed claims, citations, uncertainties and usage receipt."], ["Adopt draft", "Human selects reviewed text against expected domain revision; adoption is not final authority."]], "fields": [["Request", "Actor/tenant or explicit catalogue scope, query/refs, version selection, purpose and policy epoch."], ["Retrieval", "Selected/denied refs, closure gaps, parser/index revision and access basis."], ["Candidate", "Use/profile, exact inputs, claims/citations, uncertainty, instruction/schema/model route and digest."], ["Budget", "Logical parent, attempt/tool/time/token/currency/concurrency caps and actual charges."], ["Adoption", "Selected exact draft/span, human, expected owner revision and new draft lineage."], ["Invalidation", "Source/grant/rights/fact/configuration change, expiry, retention and derivative disposal."]], "rules": [["BR17", "Models cannot approve, adopt scope, accept evidence or issue opinions. Stored reviewed content is served without inference."], ["Profiles", "A1 analyses source, A2 drafts mapping/factual wording, A3 challenges candidates. A second model is not independent assurance."], ["Corpus boundary", "Shared curation cannot retrieve tenant evidence. Untrusted documents are data, not instructions to change tools, scope or destinations."], ["Conditional training", "No implicit cross-client learning. Fine-tuning/distillation needs rights, independent evaluation and demonstrated total benefit after retrieval/reuse improvements."]], "edges": "AccessDenied, RightsUnknown, NeedsContext, SourceUnavailable, StaleContext, SchemaInvalid, ModelUnavailable, BudgetStopped, ExecutionUncertain and Refused remain distinct. Failure uses admitted alternative or manual path, never unapproved egress.", "bulk": "Partition exact subjects under a parent spend cap; sectioning does not reset it. Application result reuse requires exact context/current rights; provider prompt caching still incurs a model call.", "exchange": "IF15 returns proposals; owning IF03/IF10/IF11/IF13 performs draft adoption. IF16 tracks actual execution. M17 meters eligible logical completions independently of provider attempts.", "example": "An explanation of CHANGE-01 cites the trace and keeps Merchant services Unknown. Keeping its wording as a draft neither changes calculation nor authorises adoption."}, {"id": "M16", "interface": "IF16", "name": "Operations governance and service controls", "value": "Recover services and apply policy with safe operational metadata while keeping operators outside semantic authority and default customer content access.", "actors": "Operators diagnose bounded jobs; security manages incidents/support; governance changes domain policies through their responsible owners.", "screens": ["SCR29", "SCR30"], "records": "E38 JobReceipt configuration incident and recovery", "steps": [["Observe", "Show queue age, state, safe error, owner, budget and dependencies within delegated scope."], ["Diagnose", "Reconcile durable receipts; request named bounded support only if needed."], ["Recover", "Cancel/retry eligible work inside existing authority and budget, without creating approval."], ["Configure", "Version route/parser/quota/policy/adapter changes and evaluate dependent work."], ["Restore/release", "Reopen only after integrity, current grants/rights/holds/disposal and reconciliation; retain historical records."]], "fields": [["Job", "Exact subject/configuration, owner/purpose, state/attempt, key and timestamps."], ["Usage", "Reserved/actual/uncertain cost, tokens/pages/bytes and concurrency; no payload by default."], ["Policy", "Revision, owner, effective time, affected scope and approval basis."], ["Support", "Named actor, justification, scope/actions, start/expiry and activity receipt."], ["Incident", "Severity, affected unit, containment, owner and permitted communications."], ["Recovery", "Snapshot/unit, isolated restore, applied current policy, integrity and reopening authority."]], "rules": [["BR18", "Operators cannot approve meaning, findings or historical authority. Retry is execution, not review."], ["Protected service", "Authority credentials/database rights are separate from workers. Modules do not mutate another owner’s records directly."], ["Current policy", "Restoring old storage cannot restore revoked access. Apply disposal/holds/current rights before disclosure."], ["Observation", "Track citation failure, backlog, unknown scope, tenant denials and partial captures; these metrics do not certify compliance."]], "edges": "Unknown external effects remain uncertain until reconciled. Search/queue/model outage exposes the affected capability and retains exact-record/manual paths where available. Safety quotas block new intake without deleting history.", "bulk": "Partition actions by owner/tenant with per-job outcomes. Software rollback cannot roll back professional records; configuration identities remain distinct from source/edition/release identities.", "exchange": "IF16 manages jobs for authority, custody, collection, AI and exit. Governance routes source rights to IF02 and access to IF01; no general force-approve control exists.", "example": "An operator can inspect Catalogue release 2 blocked rights without an Authorise button. An uncertain assistance attempt cannot restart outside its remaining parent envelope."}, {"id": "M17", "interface": "IF17", "name": "Commercial entitlements and usage", "value": "Make bought access, allowances and costs understandable without making payment a source licence or professional authority. Packaging changes purchased scope, not product semantics.", "actors": "Billing contact accepts exact price/cap schedule; commercial administrator manages effective entitlement/sponsorship; ordinary users see appropriate limits without private finance details.", "screens": ["SCR31"], "records": "E39 SubscriptionEntitlement UsageRecord commercial schedule and sponsorship", "steps": [["Preview", "Compare enterprise, firm, knowledge/API and deployment services; show rights exclusions and responsibilities."], ["Activate", "Accept exact schedule/effective time and complete provisioning; payment alone is insufficient."], ["Meter", "Reserve/finalise receipt-backed logical units; keep internal consumption separate."], ["Change", "Preview plan/proration/allowance impact and unique effective mission sponsor."], ["Restrict/exit", "Apply agreed new-work limits and lawful read/export route independently of retention/security."]], "fields": [["Entitlement", "Customer, modules, entities/families, allowance, term, deployment and effective revision."], ["Schedule", "Currency, version, units, exclusions, caps, renewal/support and accepted status."], ["Usage", "Meter/version, period, quantity, durable receipt, reserve/finalise/adjustment and key."], ["Sponsor", "Mission/category, payer interval, transfer reason and credit reference."], ["Change", "Old/new exact schedule, effect time, acceptance and provisioning result."], ["Finance boundary", "External invoice/payment IDs and reconciled status; no card data or statutory accounting engine."]], "rules": [["BR19", "Paid access grants neither source rights nor private evidence. Sponsorship does not reveal professional notes."], ["Commercial CO-P proposals", "Offers and durations remain hypotheses. Edition transition is not a new family; amendment/transfer/retry is not a new mission activation."], ["Two ledgers", "Billable originals exclude internal replicas/derivatives; physical quotas include failed/quarantined bytes. One delivered draft may involve many internal attempts."], ["Safe limits", "Proposed 80/100 percent warnings and capped opt-in overage do not relax rights/safety. Grace/exit periods require agreed contracts."]], "edges": "Duplicate/delayed billing callbacks require reconciliation. Failed provisioning never appears active. Usage disputes append credits/adjustments. Exhausted optional meters do not charge lawful historical read/export.", "bulk": "Bulk changes require individual previews/commits. Concurrent sponsorship transfers compare existing allocation; no duplicate company/firm charge for the same mission-access service.", "exchange": "IF17 provides eligibility only; IF01/IF02/professional authority remain independent. IF16 supplies receipts, IF18 owns exit. Prices and willingness to pay remain unvalidated.", "example": "Resilience review sponsor transfer changes payer prospectively, preserving mission ID, custody and authority. Alex still lacks Merchant services/export regardless of who pays."}, {"id": "M18", "interface": "IF18", "name": "Interchange export migration and exit", "value": "Provide controlled portability and closure while preserving exact provenance and explaining omissions, unavailable material and remaining custody obligations.", "actors": "Authorised owner requests export/migration/closure; privacy/data owners decide retention conflicts; operators execute bounded transfers; recipients receive entitled material only.", "screens": ["SCR32"], "records": "E40 ExportManifest migration mapping loss report and closure", "steps": [["Request", "Select exact entities/records, period, purpose, recipient/formats and account-versus-tenant closure."], ["Preview", "Identify permitted exact versions, private exclusions, protected source material, external links and unavailability."], ["Authorise/generate", "Freeze manifest/audience; create bounded package with digests, lineage and loss report."], ["Deliver/migrate", "Recheck disclosure, reconcile transfer/acknowledgement; import through staged mapping and domain admission."], ["Close", "Disable work/connections/access as authorised; apply class-specific retention/holds/disposal and record exceptions."]], "fields": [["Selection", "Exact records/scope, recipient, purpose, format and export-specific grant."], ["Manifest", "IDs/revisions/digests, provenance, classification and explicit omission/unavailability."], ["Import map", "Original namespace/ID/revision, target, transform/schema and accepted/rejected/unsupported fields."], ["Transfer", "Operation, channel/expiry, item outcome, digest verification and acknowledgement."], ["Conflict", "Competing retention/deletion/hold bases, exact scope, deadline, owner and interim decision."], ["Closure", "Retained/restricted/disposed categories, external confirmation, backup treatment and outstanding owner."]], "rules": [["BR20", "Historical export still checks current disclosure rights. Tenant closure does not grant private notes or normative text."], ["Company CO-P04 — proposal", "A hold or maximum duration does not win automatically. Assign conflicts urgently with time-bounded lawful interim handling; no universal retention duration."], ["Imported authority", "Approval flags remain external assertions, not new TAS expert or assessor acts. Preserve identity mappings and explicit loss reports."], ["Completion meaning", "Archive created is not delivered; cancellation is not disposal; external deletion is not complete before confirmed."]], "edges": "Unavailable old external material stays unavailable. Interrupted transfer resumes durably. Unsupported/denied fields are reported without leaking protected identities. Restores reapply disposal and current restrictions.", "bulk": "Preview each row, dependency and conflict. Tenant cutover uses named ownership, ID mapping and bounded reconciliation; it cannot be implemented by changing a tenant field.", "exchange": "IF18 calls current IF01/IF02/IF07 and owner export surfaces. IF16 supplies jobs; M17 cannot determine lawful retention. Private auditor custody remains separately governed.", "example": "Northstar can export permitted baselines, Quarterly access review V1 and REPORT-A-01 with exact references. Private notes are excluded; disposed material has an explicit lawful tombstone where permitted."}]};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
