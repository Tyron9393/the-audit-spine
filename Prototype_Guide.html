function icon(type='layers'){const p={layers:'M4 8 12 3 20 8 12 13Z M4 12 12 17 20 12 M4 16 12 21 20 16',Company:'M4 21V7h10v14 M14 12h6v9 M8 10h2 M8 14h2 M8 18h2',Auditor:'M14 14 21 21 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',Curation:'M12 3 20 6v6c0 5-8 9-8 9s-8-4-8-9V6Z M8 12l3 3 5-6',Administration:'M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6'};return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p[type]||p.layers}"/></svg>`}
function card(title,text,href,type){return `<a class="card" href="${href}">${icon(type)}<h3>${esc(title)}</h3><p>${esc(text)}</p><span class="muted">Explore →</span></a>`}
function flow(items){return `<div class="flow">${items.map((x,i)=>`${i?'<div class="arrow" aria-hidden="true">↓</div>':''}<div class="step"><span class="number">${i+1}</span><div><b>${esc(x[0])}</b>${esc(x[1])}</div></div>`).join('')}</div>`}
const guide=`<span class="eyebrow">Reading and demonstration guide</span><h1>One story. Four perspectives.</h1><p class="lead">Use this demonstration to explain the product before exploring its detailed design.</p><h2>Start with a concrete question</h2><p>Can Northstar Payments prepare one access-review objective for two frameworks, while preserving what each framework requires? Follow the guided story, then explore each workspace.</p><ol><li>Define the payment platform and merchant-services scope.</li><li>Review the common objective and the extra reviewer-justification obligation.</li><li>See the expert decision and the automatic publication guards.</li><li>Prepare evidence and assess its relevance independently in each mission.</li><li>Review a source change, deliberate adoption and a version-bound report.</li></ol><a class="btn" href="#tour/0">Start the guided story</a><h2>Choose a perspective</h2><p><b>Company:</b> Maya coordinates preparation; Clara provides control evidence. <b>Auditor:</b> Alex evaluates mission-specific evidence and records findings. <b>Catalogue expert:</b> a qualified reviewer authorises requirements and mappings. <b>Administration:</b> operators manage access, collection and service health.</p><h2>What is interactive?</h2><p>Navigation, workspace selection, guided steps and explanatory dialogs work locally. Tables show illustrated snapshots. Buttons explain intended product behaviour; they do not upload, approve, publish, call a model or issue a report. Switching workspaces demonstrates a view, not implemented access control.</p><h2>How to open it</h2><p>Extract the demonstration ZIP and open index.html in a desktop browser. The file is self-contained and makes no network requests. Mobile layout is included, but local HTML execution depends on the iPhone file viewer; a file preview may not execute scripts. A separately authorised web preview can be used for device review. This package does not publish a website.</p><h2>Where to read more</h2><p>Read the Product Overview first, then Global Architecture for boundaries and interactions. Product and Module Design explains user behaviour. Specialist Design contains detailed domain specifications. Execution and Contracts describes implementation interfaces. Registers and Templates contains supporting working structures. This demonstration illustrates those designs; it is not a replacement specification.</p><h2>Example boundaries</h2><p>All companies, records and framework descriptions are illustrative. They are not an authoritative mapping of PCI DSS, DORA or another standard. Screen references are provided separately for technical readers. Counts and states are examples, not live measurements.</p><h2>Review status</h2><p>Design review edition 2.0 · 24 September 2026. Static code, navigation and package checks are recorded internally. Browser rendering, keyboard interaction and real-device accessibility remain to be qualified; no claim of production readiness is made.</p><h2>Design references</h2><p>Layout and progressive-disclosure principles informed the presentation, without implying vendor endorsement.</p><ul><li><a href="https://design-system.service.gov.uk/styles/layout/">GOV.UK Design System — Layout</a></li><li><a href="https://carbondesignsystem.com/components/data-table/usage/">IBM Carbon — Data table usage</a></li><li><a href="https://carbondesignsystem.com/patterns/disclosures-pattern/">IBM Carbon — Disclosure patterns</a></li></ul><p class="muted">Sources consulted 24 September 2026.</p>`;
function home(){return `<section class="hero"><span class="eyebrow">The Audit Spine · Product demonstration</span><h1>Prepare once.<br>Keep every obligation visible.</h1><p class="lead">Connect framework requirements to your business context, organise evidence and give auditors a traceable basis for their work.</p><a class="btn" href="#tour/0">Follow the Northstar story →</a><a class="btn secondary" href="#engine">Understand the matching engine</a><p class="muted">Illustrative examples · No live data or model calls</p></section><h2>From source requirements to audit work</h2>${flow([['Understand the organisation','Entities, activities and scope determine which obligations need attention.'],['Build a shared requirement view','Connect common objectives while retaining source-specific differences.'],['Prepare and assess evidence','Company preparation and independent audit judgements stay distinct.'],['Keep change under control','Review updates and adopt versions deliberately.']])}<h2>Four workspaces, distinct responsibilities</h2><div class="grid">${card('Prepare as a company','Maya and Clara coordinate scope, requirements and evidence.','#workspace/Company','Company')}${card('Work as an auditor','Alex plans a mission, assesses evidence and develops findings.','#workspace/Auditor','Auditor')}${card('Curate the catalogue','Experts resolve mappings and authorise exact content.','#workspace/Curation','Curation')}${card('Operate the service','Administrators manage connections, permissions and service controls.','#workspace/Administration','Administration')}</div>`}
function engine(){return `<span class="eyebrow">Solution architecture</span><h1>The engine connects obligations.<br>People retain authority.</h1><p class="lead">Two frameworks can share an objective without being equivalent. The engine proposes relationships; the approved catalogue preserves the differences.</p><h2>The business view</h2>${flow([['Inputs','Permitted framework versions + organisation context + existing approved mappings.'],['Central objective','Review access regularly: a shared objective linked back to exact source requirements.'],['Source-specific obligations','Retain the resilience requirement for reviewer justification; do not hide it in a match percentage.'],['Company preparation','Show applicable requirements, differences and evidence requests for the chosen scope.'],['Audit outputs','Purpose-specific relevance decisions, findings and version-bound reports.']])}<h2>Background AI and control boundaries</h2><div class="notice">The following are logical responsibilities, not a requirement to deploy a separate autonomous agent for each step.</div>${flow([['Orchestrated intake','Software checks rights, versions and job budget before processing permitted source content.'],['Source analysis role','A model proposes structured requirements with source citations. Untrusted source content cannot grant tool permissions.'],['Mapping proposal role','A model compares requirements against approved catalogue context and identifies residual obligations.'],['Optional challenge role','A separate checking pass can flag unsupported claims. It cannot validate itself or replace expert judgement.'],['Qualified expert','Approve, reject or request revision of exact content. Direct expert review remains possible without the challenge pass.'],['Publication service','Deterministic guards check the approval, versions, permissions and validity before automatic publication.']])}<p>All model calls pass through the governed model gateway with scoped retrieval, budget limits and audit records. Model selection follows the separately qualified allocation; this demonstration does not invent a model benchmark.</p><h2>When a source changes</h2><p>Monitoring identifies a candidate change → impact analysis proposes affected requirements → expert review authorises a new catalogue version → guarded publication makes it available → the company reviews local adoption → each auditor considers mission amendment separately.</p><h2>Why every click does not need AI</h2><p>Approved requirements, mappings and evidence records are stored and reused. Background jobs process changed content. Scope rules, permissions, navigation and publication guards are deterministic. Optional assistance uses bounded, permitted context; core work remains available with inference disabled.</p><a class="btn" href="#SCR05">Explore a concrete mapping</a><a class="btn secondary" href="#SCR24">Explore change impact</a>`}
function screen(s,ti){return `<span class="eyebrow">${esc(roleNames[s.workspace])}</span><h1>${esc(s.title)}</h1><section class="hero"><span class="pill">Northstar Payments · Illustrated snapshot</span><p class="lead">${esc(s.story)}</p></section><h2>Working view</h2><div class="tablewrap"><table><caption>${esc(s.title)} — example records</caption><thead><tr>${s.columns.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map((v,i)=>i?`<td>${esc(v)}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div><h2>What this means</h2><p>${esc(s.lead)}</p><button class="btn" data-explain="${s.id}">Explain the intended action</button><details class="card"><summary>Inspect example details</summary><dl>${s.fields.map(f=>`<dt><b>${esc(f[0])}</b></dt><dd>${esc(f[1])}</dd>`).join('')}</dl></details>${ti!==undefined?`<div class="tour"><span>Story step ${ti+1} of ${tour.length}</span>${ti>0?`<a href="#tour/${ti-1}">← Previous</a>`:''}<a class="btn" href="${ti<tour.length-1?'#tour/'+(ti+1):'#home'}">${ti<tour.length-1?'Continue the story →':'Return to overview'}</a></div>`:''}<h2>Related work</h2><div class="linklist">${s.links.map(id=>{const t=CONTENT.screens.find(x=>x.id===id);return t?`<a href="#${id}">${esc(t.title)} →</a>`:''}).join('')}</div>`}
function render(){let route=location.hash.slice(1)||'guide',html;if(route==='main'){$('#main').focus();return;}const [kind,arg]=route.split('/');if(kind==='home')html=home();else if(kind==='engine')html=engine();else if(kind==='guide')html=guide;else if(kind==='directory')html=`<span class="eyebrow">Complete product scope</span><h1>Explore all modules</h1><p class="lead">Eighteen connected capabilities support the full target solution.</p><div class="grid">${CONTENT.modules.map(m=>card(m.name,'Explore the module through its illustrated working views.','#'+m.screens[0])).join('')}</div>`;else if(kind==='workspace'&&roleNames[arg])html=`<span class="eyebrow">Role-based navigation</span><h1>${roleNames[arg]}</h1><p class="lead">Choose the work you want to understand. The examples explain responsibilities and boundaries.</p><div class="grid">${CONTENT.screens.filter(s=>s.workspace===arg).map(s=>card(s.title,s.story,'#'+s.id,arg)).join('')}</div>`;else{let ti=kind==='tour'?Number(arg):undefined;let id=ti!==undefined?tour[ti]:kind;let s=CONTENT.screens.find(s=>s.id===id);html=s?screen(s,ti):'<h1>View unavailable</h1><a href="#home">Return to overview</a>'}$('#main').innerHTML=html;document.title=($('#main h1')?.textContent||'Product demonstration')+' · The Audit Spine';window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
$('#navigation').innerHTML=Object.keys(roleNames).map(r=>`<details><summary>${roleNames[r]}</summary>${CONTENT.screens.filter(s=>s.workspace===r).map(s=>`<a href="#${s.id}">${esc(s.title)}</a>`).join('')}</details>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-explain]');if(!b)return;const s=CONTENT.screens.find(s=>s.id===b.dataset.explain);$('#dialog-title').textContent=s.title;$('#dialog-copy').textContent=s.story+' This demonstration only explains the intended behaviour. No records have been changed.';$('#explanation').showModal();});window.addEventListener('hashchange',render);render();
</script></body></html>
